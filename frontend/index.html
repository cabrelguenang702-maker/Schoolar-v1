<script>
  // Enregistrement du Service Worker (PWA) — rend l'app installable sur
  // mobile et accélère les chargements suivants. Échec silencieux si le
  // navigateur ne supporte pas les service workers ou si servi en http://
  // non-localhost (les navigateurs exigent https:// pour cette API, sauf
  // sur localhost/127.0.0.1 — donc ça fonctionnera en test XAMPP local).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {
        // silencieux : l'app fonctionne normalement même sans SW (juste sans
        // installation ni cache hors-ligne)
      });
    });
  }
</script>
